<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranton</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#a78bfa">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 54 54'%3E%3Crect width='54' height='54' rx='16' fill='%23a78bfa'/%3E%3Cpath d='M12 22c0-5 4-9 9-9h12c5 0 9 4 9 9v6c0 5-4 9-9 9h-7l-7 6v-6c-4-1-7-5-7-9z' fill='%2314121c'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Poppins:wght@600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --rail:#0f0e16; --side:#1b1926; --chat:#221f2e; --panel:#1b1926; --line:#2e2a3d;
  --txt:#e9e6f5; --mut:#9a94b3; --acc:#a78bfa; --acc2:#ff7a90; --good:#7bd88f; --warn:#ffcf5c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--rail);color:var(--txt);font-family:Nunito,system-ui,sans-serif;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none}
#app{display:grid;grid-template-columns:72px 240px 1fr 280px;height:100vh;height:100dvh}
/* rail */
#rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0}
.srv{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:#26233a;transition:.2s;position:relative}
.srv.on{border-radius:16px;background:var(--acc)}
.srv.on::before{content:"";position:absolute;left:-12px;width:4px;height:36px;border-radius:0 4px 4px 0;background:#fff}
.sep{width:32px;height:2px;background:var(--line);border-radius:2px}
/* sidebar */
#side{background:var(--side);display:flex;flex-direction:column;min-height:0}
#srvname{padding:14px 16px;font-weight:900;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
#srvname small{color:var(--acc2);font-size:11px;font-weight:800;background:#ff7a9022;padding:2px 6px;border-radius:6px;white-space:nowrap}
#chlist{overflow-y:auto;padding:8px;flex:1}
.grp{color:var(--mut);font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;margin:14px 8px 6px}
.ch{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border-radius:8px;background:none;color:var(--mut);font-size:15px;font-weight:700;text-align:left}
.ch:hover{background:#ffffff0d;color:var(--txt)}
.ch.on{background:#ffffff17;color:#fff}
.ch.unread{color:#fff}
.ch .ico{width:22px;text-align:center;flex:none}
.ch .av{width:26px;height:26px;font-size:14px}
.ch .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{background:var(--acc2);color:#fff;font-size:11px;font-weight:900;border-radius:10px;padding:1px 7px}
.ch.locked{opacity:.4;pointer-events:none}
#me{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#15131f}
#me b{font-size:14px} #me span{display:block;font-size:11px;color:var(--good)}
/* chat */
#chat{background:var(--chat);display:flex;flex-direction:column;min-width:0;min-height:0}
#chead{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);font-weight:900}
#htitle{white-space:nowrap}
#chead .sub{color:var(--mut);font-weight:600;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mobbtn{display:none;background:#ffffff12;color:var(--txt);border-radius:8px;padding:6px 10px;font-size:16px}
#msgs{flex:1;overflow-y:auto;padding:16px 0 8px}
.msg{display:flex;gap:12px;padding:6px 16px;position:relative}
.msg:hover{background:#00000018}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none}
.mb{min-width:0;flex:1}
.mh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mh b{font-weight:800}
.role{font-size:10px;font-weight:900;padding:1px 6px;border-radius:5px;background:#ffffff14;color:var(--mut);text-transform:uppercase}
.tm{font-size:11px;color:var(--mut)}
.mt{line-height:1.45;font-size:15px;word-wrap:break-word;margin-top:2px}
.link{color:#6cb6ff;text-decoration:underline;cursor:pointer}
.sys .mt{color:var(--mut);font-style:italic}
.sys .av{background:none;font-size:18px;width:40px;height:22px}
.mag{position:absolute;right:12px;top:6px;background:#2f2a44;color:var(--txt);border-radius:8px;padding:4px 9px;font-size:13px;font-weight:800;opacity:0;transition:.15s}
.msg:hover .mag{opacity:1}
.mag:hover{background:var(--acc);color:#14121c}
.msg.found{background:#a78bfa14;box-shadow:inset 3px 0 0 var(--acc)}
.msg.found .mag{opacity:1;background:var(--acc);color:#14121c}
.flash{animation:fl .8s}
@keyframes fl{0%{background:#a78bfa55}100%{background:#a78bfa14}}
.newmsg{animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#typing{height:22px;padding:0 16px;font-size:12px;color:var(--mut);font-weight:700}
.dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--mut);margin-right:2px;animation:bl 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
#composer{padding:0 16px 16px;flex:none}
.cbox{background:#2c2840;border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;min-height:48px;align-items:center}
.cbox .ph{color:var(--mut);font-size:14px;padding:4px 6px}
.opt{background:#3a3456;color:var(--txt);border-radius:10px;padding:9px 14px;font-weight:800;font-size:14px;text-align:left;transition:.15s}
.opt:hover{background:var(--acc);color:#14121c;transform:translateY(-1px)}
.opt.ask::before{content:"💬 "}
/* notebook */
#note{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#note h2{font-size:16px;font-weight:900;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
#goal{margin:12px;padding:12px;border-radius:12px;background:#ffcf5c14;border:1px solid #ffcf5c44;font-size:13px;line-height:1.45}
#goal b{color:var(--warn)}
#clues{flex:1;overflow-y:auto;padding:0 12px}
.clue{background:#26233a;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px;line-height:1.4;animation:pop .3s}
.clue .tag{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.tag.evidence{color:var(--acc2)} .tag.alibi{color:var(--good)} .tag.lead{color:var(--warn)}
.empty{color:var(--mut);font-size:13px;padding:8px 4px;line-height:1.5}
#accuse{margin:12px;padding:14px;border-radius:12px;background:var(--acc2);color:#fff;font-weight:900;font-size:16px}
#accuse:disabled{background:#3a3456;color:var(--mut);cursor:not-allowed}
/* toast + modal */
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#0f0e16;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-weight:800;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.ov{position:fixed;inset:0;background:#07060bcc;display:none;place-items:center;z-index:50;padding:16px}
.ov.show{display:grid}
.card{background:var(--side);border:1px solid var(--line);border-radius:18px;padding:24px;width:min(520px,100%);max-height:92vh;overflow-y:auto}
.card h1{font-size:26px;font-weight:900;margin-bottom:8px}
.card h3{font-size:14px;color:var(--mut);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.05em}
.card p{line-height:1.5;color:#cfc9e6;margin-bottom:10px}
.big{display:block;width:100%;padding:14px;border-radius:12px;background:var(--acc);color:#14121c;font-weight:900;font-size:17px;margin-top:14px}
.big:hover{filter:brightness(1.1)}
.big.ghost{background:#3a3456;color:var(--txt)}
input[type=text]{width:100%;padding:13px;border-radius:12px;border:2px solid var(--line);background:#14121c;color:var(--txt);font:inherit;font-size:16px;font-weight:700}
input[type=text]:focus{outline:none;border-color:var(--acc)}
.sus{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick{background:#26233a;color:var(--txt);border:2px solid transparent;border-radius:12px;padding:10px 6px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px}
.pick.sel{border-color:var(--acc2);background:#ff7a9022}
.meth .pick{flex-direction:row;text-align:left;font-size:14px;padding:12px;width:100%;margin-bottom:6px}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo svg{flex:none}
.logo b{font-size:15px;color:var(--acc);letter-spacing:.08em;text-transform:uppercase}
.rank{font-size:64px;font-weight:900;text-align:center;line-height:1;margin:6px 0}
.tip{background:#7bd88f14;border:1px solid #7bd88f44;border-radius:12px;padding:12px;font-size:14px;line-height:1.5;margin-top:12px}
.fake{background:#fff;color:#222;border-radius:12px;padding:16px;margin:12px 0;font-family:system-ui}
.fake .url{background:#eee;border-radius:6px;padding:6px 10px;font-size:13px;margin-bottom:12px;color:#b00}
.fake .fld{border:1px solid #ccc;border-radius:6px;padding:8px;margin-bottom:8px;color:#999;font-size:14px}
#mute{background:none;color:var(--mut);font-size:16px}

#nbwrap,#memwrap{display:flex;flex-direction:column;min-height:0;flex:1}
#members{overflow-y:auto;padding:8px 12px;flex:1}
.mem{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px}
.mem.off{opacity:.45}
.mem .av{width:34px;height:34px;font-size:17px;position:relative}
.mem .av i{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;border:3px solid var(--panel);background:#6b6680}
.mem.on .av i{background:var(--good)}
.mem b{font-size:14px;display:block} .mem small{font-size:12px;color:var(--mut)}
.mgrp{color:var(--mut);font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;margin:12px 8px 4px}
.srv.add{background:#26233a;color:var(--good);font-size:26px}
.srv.add:hover{background:var(--good);color:#14121c;border-radius:16px}
.srv:hover{border-radius:16px}
.srv .dot{position:absolute;right:-1px;top:-1px;width:14px;height:14px;border-radius:50%;background:var(--acc2);border:3px solid var(--rail)}
.srv .tip2{position:absolute;left:60px;background:#0b0a10;color:#fff;font-size:13px;font-weight:800;padding:6px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;z-index:30;transition:.1s}
.srv:hover .tip2{opacity:1}
.code{cursor:pointer;color:var(--good)!important;background:#7bd88f22!important}
.leave{margin:16px 8px 8px;background:none;color:var(--mut);font-size:13px;font-weight:800}
.leave:hover{color:var(--acc2)}
.addch{color:var(--mut);background:none;font-size:13px;font-weight:800;padding:6px 10px}
.addch:hover{color:var(--txt)}
.real{flex-wrap:nowrap}
.real input{flex:1;background:none;border:none;color:var(--txt);font:inherit;font-size:15px;padding:4px 6px;min-width:0}
.real input:focus{outline:none}
.send{background:var(--acc);color:#14121c;font-weight:900;border-radius:9px;padding:8px 14px}
.send:disabled{opacity:.4}
.msg.cont{padding-top:1px;padding-bottom:1px}
.msg.cont .av{height:0;visibility:hidden}
.del{position:absolute;right:12px;top:4px;background:#2f2a44;color:var(--mut);border-radius:8px;padding:3px 8px;font-size:12px;opacity:0}
.msg:hover .del{opacity:1}
.del:hover{background:var(--acc2);color:#fff}
.emopick{display:flex;flex-wrap:wrap;gap:8px}
.emopick button{width:46px;height:46px;border-radius:50%;font-size:22px;background:#26233a;border:3px solid transparent}
.emopick button.sel{border-color:var(--acc)}
.tabs{display:flex;gap:8px;margin:6px 0 12px}
.tabs button{flex:1;padding:10px;border-radius:10px;background:#26233a;color:var(--mut);font-weight:900}
.tabs button.on{background:var(--acc);color:#14121c}
.slist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.srow{display:flex;align-items:center;gap:12px;background:#26233a;padding:10px;border-radius:12px}
.srow .srv{width:42px;height:42px;font-size:20px;flex:none}
.srow div{flex:1;min-width:0} .srow b{display:block} .srow small{color:var(--mut)}
.srow button{background:var(--good);color:#14121c;font-weight:900;border-radius:9px;padding:8px 14px}
.srow button:disabled{background:#3a3456;color:var(--mut)}
.err{color:var(--acc2);font-size:13px;font-weight:800;margin-top:8px;min-height:18px}
.fpage{padding:4px 20px 20px}
.ftabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ftabs button{background:none;color:var(--mut);font-weight:800;font-size:14px;padding:6px 12px;border-radius:8px}
.ftabs button:hover{background:#ffffff0d;color:var(--txt)}
.ftabs button.on{background:#ffffff17;color:#fff}
.ftabs .addt{background:var(--good);color:#14121c}.ftabs .addt.on{background:transparent;color:var(--good)}
.fpage h3{font-size:13px;color:var(--mut);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.05em}
.mycode{display:flex;align-items:center;gap:12px;background:#14121c;border:2px dashed var(--acc);border-radius:12px;padding:12px 14px}
.mycode span{flex:1;font-size:24px;font-weight:900;color:var(--acc);overflow:hidden;text-overflow:ellipsis}
.linkbtn{display:block;margin:12px auto 0;background:none;color:var(--acc);font-weight:800;font-size:14px}
.linkbtn:hover{text-decoration:underline}
input[type=password]{width:100%;padding:13px;border-radius:12px;border:2px solid var(--line);background:#14121c;color:var(--txt);font:inherit;font-size:16px;font-weight:700}
input[type=password]:focus{outline:none;border-color:var(--acc)}
.keep{display:flex;align-items:center;gap:8px;margin-top:12px;color:#cfc9e6;font-weight:700;font-size:14px;cursor:pointer}
.keep input{width:18px;height:18px;accent-color:var(--acc)}
.acct{background:#26233a;border-radius:10px;padding:10px 12px;font-size:14px}
#me{cursor:pointer}#me:hover{background:#1c1a28}
.hint{color:var(--mut);font-size:13px;margin-top:6px}
.frow{display:flex;align-items:center;gap:12px;padding:10px;border-top:1px solid var(--line)}
.frow:hover{background:#ffffff08;border-radius:10px}
.fi{flex:1;min-width:0}.fi b{display:block}.fi small{color:var(--mut);font-size:12px}
.fb{display:flex;gap:6px}
.fbtn{border-radius:9px;padding:8px 12px;font-weight:800;font-size:13px}
.fbtn.go{background:var(--acc);color:#14121c}.fbtn.no{background:#3a3456;color:var(--txt)}
.av{position:relative}
.av i{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;border:3px solid var(--chat);background:#6b6680;display:none}
.frow .av i,.dmrow .av i,.dmintro .av i,.mem .av i{display:block}
.av i.on,.mem.on .av i{background:var(--good)}
.dmrow{padding:6px 8px}.dmrow .lbl{display:flex;flex-direction:column}.dmrow .nm{overflow:hidden;text-overflow:ellipsis}
.dmrow .pv{font-size:12px;color:var(--mut);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmrow .av i{border-color:var(--side);width:10px;height:10px}
.dmintro{padding:16px 16px 10px}.dmintro h2{font-size:24px;font-weight:900;margin-top:8px}.dmintro p{color:var(--mut)}
button.mem{width:100%;background:none;color:var(--txt);text-align:left}
button.mem:hover{background:#ffffff0d}
/* mobile */
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  #rail{position:fixed;top:0;bottom:0;left:0;width:64px;z-index:41;transform:translateX(-100%);transition:transform .25s;overflow-y:auto}
  #rail.open{transform:none}
  .srv{width:44px;height:44px;flex:none}
  .srv .tip2{display:none}
  #side,#note{position:fixed;top:0;bottom:0;width:min(300px,86vw);z-index:40;transition:transform .25s}
  #side{left:64px;width:min(260px,calc(100vw - 110px));transform:translateX(calc(-100% - 64px))}
  #note{right:0;transform:translateX(100%)}
  #side.open,#note.open{transform:none;box-shadow:0 0 40px #000}
  .mobbtn{display:inline-block}
  .mag{opacity:.55}
  #scrim{position:fixed;inset:0;background:#0008;z-index:35;display:none}
  #scrim.show{display:block}
}

input[type=email]{width:100%;padding:13px;border-radius:12px;border:2px solid var(--line);background:#14121c;color:var(--txt);font:inherit;font-size:16px;font-weight:700}
input[type=email]:focus{outline:none;border-color:var(--acc)}
.big.google{background:#fff;color:#222;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:0}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;font-weight:800;margin:14px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
#rail .srv{flex:none}
/* presence dots */
.av i.away{background:#f5c542!important;display:block}
.av i.dnd{background:#ef4444!important;display:block}
.av i.on{background:var(--good)}
#meav{position:relative}#meav i{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;border:3px solid #15131f;display:block}
#merole{color:var(--mut)!important;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#me .gear{color:var(--mut);font-size:15px}
.setb{background:transparent!important;font-size:22px}
.grp.grow{display:flex;align-items:center;justify-content:space-between}
.newg{background:none;color:var(--mut);font-size:18px;font-weight:900;padding:0 4px;line-height:1}
.newg:hover{color:var(--txt)}
.badge.live{background:var(--good);color:#14121c}
.gav{background:#3a3456;border-radius:14px!important}
/* messages */
.msg .mtools{position:absolute;right:12px;top:-12px;display:none;gap:2px;background:#2f2a44;border:1px solid var(--line);border-radius:10px;padding:2px;z-index:3}
.msg:hover .mtools{display:flex}
.mtools button{background:none;color:var(--txt);font-size:15px;padding:4px 7px;border-radius:7px}
.mtools button:hover{background:#ffffff1a}
.rpick{position:absolute;top:-44px;right:0;display:flex;gap:2px;background:#1b1926;border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 6px 20px #0008}
.rpick button{font-size:20px;padding:4px 6px}
.reacts{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.reacts:empty{display:none}
.rx{background:#2c2840;border:1px solid transparent;color:var(--txt);border-radius:9px;padding:2px 8px;font-size:13px;font-weight:800}
.rx.mine{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 22%,transparent)}
.rq{font-size:12.5px;color:var(--mut);border-left:3px solid var(--acc);padding:2px 8px;margin:2px 0 4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px}
.mimg{display:block;max-width:min(360px,100%);max-height:320px;border-radius:12px;margin-top:6px;cursor:zoom-in}
.seen{text-align:right;color:var(--mut);font-size:12px;font-weight:700;padding:2px 18px 6px}
.msg.sys .mt{color:var(--mut);font-style:italic;font-size:13px}
.msg.flash{animation:fl 1.2s}
.replybar{display:flex;align-items:center;gap:8px;background:#2c2840;border-radius:12px 12px 0 0;padding:8px 12px;font-size:13px;color:var(--mut);margin-bottom:-6px}
.replybar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.replybar button{background:none;color:var(--mut);font-size:14px}
.att{background:none;font-size:20px;padding:0 4px}
.gbanner{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 16px;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--good) 18%,transparent);border:1px solid color-mix(in srgb,var(--good) 45%,transparent);font-weight:800}
.gbanner .send{background:var(--good)}
/* menus + settings */
.uhead{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.uhead h1{margin:0}.ust{color:var(--mut);margin:0}
.umenu .big{margin-top:8px}
.stabs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.stabs button{background:#26233a;color:var(--mut);font-weight:800;border-radius:9px;padding:7px 10px;font-size:13px}

/* ---------- small helpers ---------- */
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('show'),2600)}
function modal(html){$('mcard').innerHTML=html;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
window.closeModal=closeModal;
let AC=null;
function ping(hi){if(!ST.sound||ME.mode==='dnd')return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=hi?880:620;g.gain.setValueAtTime(.0001,AC.currentTime);g.gain.exponentialRampToValueAtTime(.08,AC.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.18);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.2)}catch(e){}}
const pairId=(a,b)=>[a,b].sort().join('_');
const otherOf=id=>id.split('_').find(x=>x!==ME.uid)||ME.uid;
const ms=t=>t&&t.toMillis?t.toMillis():(typeof t==='number'?t:0);
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const goodPic=s=>typeof s==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s);
function who(id){const p=ST.profiles[id]||{};const real=String(p.nick||'…').slice(0,16),nn=(ST.nicks||{})[id];
  return{nick:nn?String(nn).slice(0,20):real,real,emoji:EMOJIS.includes(p.emoji)?p.emoji:'⭐',color:/^#[0-9a-f]{6}$/i.test(p.color||'')?p.color:'#a78bfa',
    status:String(p.status||'').slice(0,40),pic:goodPic(p.pic)?p.pic:null,bio:String(p.bio||'').slice(0,150),banner:/^#[0-9a-f]{6}$/i.test(p.banner||'')?p.banner:null,
    joined:ms(p.joined),msgs:Number(p.msgCount)||0,uname:String(p.uname||'')}}
const isOnline=id=>{const p=ST.profiles[id];return !!(p&&p.online!==false&&Date.now()-ms(p.lastSeen)<ONLINE_MS)};
function presence(id){if(!isOnline(id))return'offline';const p=ST.profiles[id]||{};if(p.mode==='dnd')return'dnd';if(p.mode==='away'||p.idle)return'away';return'online'}
const PLABEL={online:'online',away:'away',dnd:'do not disturb',offline:'offline'};
function statusOf(id){const w=who(id),pr=presence(id);return w.status&&pr!=='offline'?w.status:PLABEL[pr]}
function niceErr(e){const c=(e&&e.code)||'';
  return {'auth/invalid-email':'That email doesn’t look right.','auth/email-already-in-use':'There’s already an account with that email. Try signing in.',
  'auth/weak-password':'Password must be at least 6 characters.','auth/invalid-credential':'Wrong email or password.','auth/wrong-password':'Wrong email or password.',
  'auth/user-not-found':'Wrong email or password.','auth/too-many-requests':'Too many tries. Wait a minute and try again.',
  'auth/popup-closed-by-user':'Google sign-in was closed.','auth/unauthorized-domain':'This website isn’t allowed yet. Add it in Firebase > Authentication > Settings > Authorized domains.',
  'auth/network-request-failed':'No internet connection.','permission-denied':'Not allowed. (If you just updated Ranton, make sure the new Firestore rules are published.)',
  'auth/operation-not-allowed':'This sign-in type is turned off. Turn it on in Firebase > Authentication > Sign-in method.',
  'auth/requires-recent-login':'For safety, sign out and sign back in, then try again.',
  'auth/api-key-not-valid.-please-pass-a-valid-api-key.':'The Firebase settings in this file are wrong (apiKey).','auth/invalid-api-key':'The Firebase settings in this file are wrong (apiKey).'}[c]||('Something went wrong. Try again. (error: '+(c||(e&&e.message)||'unknown')+')')}

const THEMES=['pop','dark','light','ocean','neon','pink'];
function applyTheme(){
  const th=PREF.theme||'pop';THEMES.forEach(t=>document.body.classList.toggle(t,(th===t&&t!=='dark')||(t==='light'&&th==='pop')));
  const a=ACCENTS[PREF.accent]||((PREF.theme||'pop')==='pop'?ACCENTS.blue:ACCENTS.coral);document.documentElement.style.setProperty('--acc',a);

/* ---------- boot ---------- */
async function boot(){
  if(Object.values(firebaseConfig).some(v=>!v||v==='PASTE_HERE')){
    $('startBody').innerHTML=`<h1>Almost ready! 🛠️</h1><p>Ranton needs its Firebase settings. Open this file in a text editor and paste them where it says <b>PASTE_HERE</b> at the top of the script.</p>`;return}
  try{
    const base=`https://www.gstatic.com/firebasejs/${V}/`;
    const [app,a,f]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
    A=a;F=f;const fa=app.initializeApp(firebaseConfig);auth=A.getAuth(fa);db=F.getFirestore(fa);
  }catch(e){$('startBody').innerHTML=`<h1>Can’t load 😕</h1><p>Check your internet connection and reload.</p>`;return}
  A.onAuthStateChanged(auth,async user=>{
    if(!user){stopAll();showAuth('in');return}
    if(needsVerify(user)){stopAll();showVerify(user);return}
    ME.uid=user.uid;
    let prof=null;try{const d=await F.getDoc(F.doc(db,'profiles',user.uid));if(d.exists())prof=d.data()}catch(e){}
    if(prof&&prof.uname){Object.assign(ME,{nick:prof.nick||prof.uname,uname:prof.uname,emoji:EMOJIS.includes(prof.emoji)?prof.emoji:ME.emoji,color:prof.color||ME.color,status:prof.status||'',mode:['online','away','dnd'].includes(prof.mode)?prof.mode:'online'});enterApp()}
    else showProfile(false,user.displayName);
  });
}

function showProfile(edit,suggest){
  $('start').classList.add('show');const b=$('startBody');
  b.innerHTML=`<h1>${edit?'Edit your profile':'Pick your username'}</h1>
    <h3>Username</h3><input type="text" id="un" maxlength="16" placeholder="e.g. cool_name" autocomplete="off">
    <p class="hint">3–16 letters, numbers or _. Friends type this to add you.</p>
    <h3>Avatar</h3><div id="emopick" class="emopick"></div>
    <div class="err" id="uerr"></div>
    <button class="big" id="ugo">${edit?'Save':'Start chatting'}</button>
    ${edit?'<button class="big ghost" id="ucancel">Cancel</button><button class="big ghost" id="uout" style="color:var(--acc2)">Sign out</button>':'<button class="linkbtn" id="uout">Sign out</button>'}`;
  $('un').value=edit?ME.nick:String(suggest||'').replace(/[^A-Za-z0-9_]/g,'').slice(0,16);
  EMOJIS.forEach(e=>{const x=document.createElement('button');x.textContent=e;x.className=e===ME.emoji?'sel':'';x.onclick=()=>{ME.emoji=e;$('emopick').querySelectorAll('button').forEach(y=>y.classList.toggle('sel',y===x))};$('emopick').appendChild(x)});
  $('ugo').onclick=()=>saveProfile(edit);$('un').onkeydown=e=>{if(e.key==='Enter')saveProfile(edit)};
  $('uout').onclick=signOut;if(edit)$('ucancel').onclick=()=>$('start').classList.remove('show');
  setTimeout(()=>$('un')&&$('un').focus(),50);
}
async function saveProfile(edit){
  const raw=$('un').value.trim(),err=t=>{if($('uerr'))$('uerr').textContent=t};
  if(!/^[A-Za-z0-9_]{3,16}$/.test(raw))return err('Use 3–16 letters, numbers or _ (no spaces).');
  const lc=raw.toLowerCase(),old=ME.uname;$('ugo').disabled=true;err('');
  try{
    await F.runTransaction(db,async tx=>{
      const nref=F.doc(db,'usernames',lc);
      if(lc!==old){const n=await tx.get(nref);if(n.exists()&&n.data().uid!==ME.uid)throw{code:'taken'};tx.set(nref,{uid:ME.uid})}
      tx.set(F.doc(db,'profiles',ME.uid),{nick:raw,uname:lc,emoji:ME.emoji,color:ME.color,lastSeen:F.serverTimestamp(),online:true,...(old?{}:{joined:Date.now()})},{merge:true});
      if(old&&old!==lc)tx.delete(F.doc(db,'usernames',old));
    });
  }catch(e){if($('ugo'))$('ugo').disabled=false;return err(e&&e.code==='taken'?`"${raw}" is taken. Try another one!`:niceErr(e))}
  Object.assign(ME,{nick:raw,uname:lc});
  if(edit){$('start').classList.remove('show');updateMe();toast('✅ Profile saved');return}
  enterApp();
}
async function signOut(){
  try{await F.setDoc(F.doc(db,'profiles',ME.uid),{online:false},{merge:true})}catch(e){}
  stopAll();await A.signOut(auth);
}


/* ---------- email verification ---------- */
function needsVerify(user){return !user.emailVerified&&(user.providerData||[]).some(p=>p.providerId==='password')&&!(user.providerData||[]).some(p=>p.providerId==='google.com')}
function showVerify(user){
  $('start').classList.add('show');const b=$('startBody');
  b.innerHTML=`<h1>📧 Check your email</h1><p>We sent a link to <b id="vem"></b>. Open it and click the link to prove it’s really your email.</p>
    <p class="hint">Can’t find it? Check your <b>Spam</b> or <b>Promotions</b> folder.</p>
    <div class="err" id="verr"></div>
    <button class="big" id="vdone">✅ I clicked the link</button>
    <button class="big ghost" id="vresend">📨 Send the email again</button>

  $('vem').textContent=user.email||'your email';
  $('vdone').onclick=async()=>{

  $('vout').onclick=()=>A.signOut(auth);

/* ---------- conversations (DMs + groups) ---------- */
const isGroup=k=>k&&k[0]==='g';
const cid=k=>k.slice(2);
const convRef=k=>F.doc(db,isGroup(k)?'groups':'dms',cid(k));
const msgsCol=(k,ch)=>{ch=ch||(isGroup(k)?ST.ch:'general');return isGroup(k)&&ch!=='general'?F.collection(db,'groups',cid(k),'chans',ch,'msgs'):F.collection(db,isGroup(k)?'groups':'dms',cid(k),'msgs')};
function convSet(k,data){return isGroup(k)?F.setDoc(convRef(k),data,{merge:true}):F.setDoc(convRef(k),{users:cid(k).split('_'),...data},{merge:true})}
const convData=k=>k?(isGroup(k)?ST.groups[cid(k)]:ST.dms[cid(k)]):null;
const convUsers=k=>isGroup(k)?((convData(k)||{}).users||[]):cid(k).split('_');
const dmKey=f=>'d:'+pairId(f,ME.uid);
function convTitle(k){if(isGroup(k)){const g=convData(k)||{};return String(g.name||'Group').slice(0,24)}return who(otherOf(cid(k))).nick}
function lastAt(k){const c=convData(k)||{};return c.last?ms(c.last.at):ms(c.t)}
function isUnread(k){const c=convData(k);return !!(c&&c.last&&c.last.by!==ME.uid&&ms(c.last.at)>ms((c.seen||{})[ME.uid])&&!(ST.conv===k&&!document.hidden))}
function isTypingIn(k,id){const c=convData(k);return !!(c&&c.typing&&Date.now()-ms(c.typing[id])<5000)}
function canChat(k){if(!k)return false;if(isGroup(k))return convUsers(k).includes(ME.uid);const o=otherOf(cid(k));return !!ST.friends[o]&&!ST.blocks.has(o)}

function markSeen(k){
  const c=convData(k);if(!c||!c.last||document.hidden)return;
  if(ms(c.last.at)<=ms((c.seen||{})[ME.uid]))return;
  clearTimeout(ST.seenT);ST.seenT=setTimeout(()=>F.updateDoc(convRef(k),{['seen.'+ME.uid]:Date.now()}).catch(()=>{}),500);
}
function notify(k,c){
  if(c.last&&isFun(c.last.text)&&ST.conv===k)confetti();
  const mention=isGroup(k)&&c.last&&mentionsMe(c.last.text);
  if(ME.mode==='dnd'&&!mention)return;
  if(mention&&!(ST.conv===k&&!document.hidden)){ping(true);toast('🔔 '+who(c.last.by).nick+' mentioned you in '+convTitle(k));}
  const open=ST.conv===k&&!document.hidden;
  if(!open){ping(true);toast('💬 '+(isGroup(k)?convTitle(k)+' · ':'')+who(c.last.by).nick+': '+(c.last.text||'📷 Picture'))}
  if(document.hidden&&PREF.notif&&'Notification' in window&&Notification.permission==='granted'){
    try{const n=new Notification(isGroup(k)?convTitle(k):who(c.last.by).nick,{body:(isGroup(k)?who(c.last.by).nick+': ':'')+(c.last.text||'📷 Picture'),tag:k});n.onclick=()=>{window.focus();openConv(k);n.close()}}catch(e){}
  }
}

function stopAll(){

  ST.unsub.forEach(u=>{try{u()}catch(e){}});ST.unsub=[];

  if(ST.msgUnsub)ST.msgUnsub();ST.msgUnsub=null;clearInterval(ST.beat);
  Object.assign(ST,{profiles:{},friends:{},reqIn:[],reqOut:[],blocks:new Set(),dms:{},groups:{},calls:{},conv:null,msgs:[],started:false,firstGroups:true});

function watchProfile(id){
  if(!id||ST.profUnsub[id])return;
  ST.profUnsub[id]=F.onSnapshot(F.doc(db,'profiles',id),d=>{ST.profiles[id]=d.exists()?d.data({serverTimestamps:'estimate'}):{};if(id===ME.uid)updateMe();redraw()},()=>{});
}
function beat(){F.setDoc(F.doc(db,'profiles',ME.uid),{lastSeen:F.serverTimestamp(),online:true,idle:document.hidden&&Date.now()-ST.hiddenSince>120000},{merge:true}).catch(()=>{})}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)ST.hiddenSince=Date.now();
  if(ST.started){beat();if(!document.hidden&&ST.conv){markSeen(ST.conv);redraw()}}
});
window.addEventListener('pagehide',()=>{if(!ST.started)return;if(GC.gid)leaveGroupCall();F.setDoc(F.doc(db,'profiles',ME.uid),{online:false},{merge:true}).catch(()=>{})});

function enterApp(){
  $('start').classList.remove('show');updateMe();
  if(ST.started)return;ST.started=true;
  watchProfile(ME.uid);beat();ST.beat=setInterval(()=>{beat();redraw()},BEAT_MS);
  const u=ME.uid,q=(...a)=>F.query(...a),c=n=>F.collection(db,n),W=e=>console.warn(e);
  ST.unsub.push(F.onSnapshot(q(c('friends'),F.where('users','array-contains',u)),s=>{
    ST.friends={};s.forEach(d=>{const o=(d.data().users||[]).find(x=>x!==u);if(o){ST.friends[o]=d.id;watchProfile(o)}});redraw();if(ST.conv)rComposer()},W));
  let firstReq=true;
  ST.unsub.push(F.onSnapshot(q(c('requests'),F.where('to','==',u)),s=>{
    const before=ST.reqIn.length;ST.reqIn=[];s.forEach(d=>{const v=d.data();if(ST.blocks.has(v.from))return;ST.reqIn.push({id:d.id,...v});watchProfile(v.from)});
    if(!firstReq&&ST.reqIn.length>before){ping(true);setTimeout(()=>toast('👋 '+who(ST.reqIn[ST.reqIn.length-1].from).nick+' sent you a friend request!'),400)}
    firstReq=false;redraw()},W));
  ST.unsub.push(F.onSnapshot(q(c('requests'),F.where('from','==',u)),s=>{ST.reqOut=[];s.forEach(d=>{ST.reqOut.push({id:d.id,...d.data()});watchProfile(d.data().to)});redraw()},W));
  ST.unsub.push(F.onSnapshot(q(c('blocks'),F.where('blocker','==',u)),s=>{ST.blocks=new Set();s.forEach(d=>{ST.blocks.add(d.data().blocked);watchProfile(d.data().blocked)});redraw();if(ST.conv)rComposer()},W));
  let firstDm=true;
  ST.unsub.push(F.onSnapshot(q(c('dms'),F.where('users','array-contains',u)),s=>{
    const old=ST.dms;ST.dms={};
    s.forEach(d=>{const v=d.data({serverTimestamps:'estimate'});ST.dms[d.id]=v;const o=otherOf(d.id);watchProfile(o);
      const p=old[d.id];if(!firstDm&&v.last&&v.last.by!==u&&!ST.blocks.has(o)&&(!p||!p.last||ms(p.last.at)<ms(v.last.at)))notify('d:'+d.id,v)});
    firstDm=false;redraw();rTyping();if(ST.conv&&!isGroup(ST.conv)){markSeen(ST.conv);rWatch()}},W));
  ST.unsub.push(F.onSnapshot(q(c('groups'),F.where('users','array-contains',u)),s=>{
    const old=ST.groups;ST.groups={};
    s.forEach(d=>{const v=d.data({serverTimestamps:'estimate'});ST.groups[d.id]=v;(v.users||[]).forEach(watchProfile);
      const p=old[d.id];if(!ST.firstGroups&&v.last&&v.last.by!==u&&(!p||!p.last||ms(p.last.at)<ms(v.last.at)))notify('g:'+d.id,v);
      if(!ST.firstGroups&&!p)toast('👥 You were added to '+String(v.name||'a group'));
      onGroupCallState(d.id,v,p)});
    if(GC.gid&&!ST.groups[GC.gid])leaveGroupCall(true);

async function addFriend(name){
  const err=t=>{if($('ferr'))$('ferr').textContent=t};const lc=String(name||'').trim().replace(/^@/,'').toLowerCase();
  if(!lc)return;if(lc===ME.uname)return err("That's you, silly 😄");
  let fid=null;try{const s=await F.getDoc(F.doc(db,'usernames',lc));fid=s.exists()&&s.data().uid}catch(e){return err(niceErr(e))}
  if(!fid)return err('No one has that username. Check the spelling!');
  if(ST.blocks.has(fid))return err('You blocked this person. Unblock them in ⚙️ Settings first.');
  watchProfile(fid);
  if(ST.friends[fid])return err(`You're already friends with ${who(fid).nick||lc}!`);
  const back=ST.reqIn.find(r=>r.from===fid);if(back)return acceptReq(back);
  if(ST.reqOut.find(r=>r.to===fid))return err('Request already sent. Waiting for them!');
  try{await F.setDoc(F.doc(db,'requests',fid+'_'+ME.uid),{to:fid,from:ME.uid,at:F.serverTimestamp()})}
  catch(e){return err(e&&e.code==='permission-denied'?'You can’t add this person.':niceErr(e))}
  toast('📨 Friend request sent to '+lc+'!');ST.tab='pending';rMsgs();
}

function shrinkPic(file){
  return new Promise((res,rej)=>{if(!file.type.startsWith('image/'))return rej({msg:'That’s not a picture.'});
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{URL.revokeObjectURL(url);const S=256,cv=document.createElement('canvas');cv.width=cv.height=S;const cx=cv.getContext('2d');
      const s=Math.min(im.width,im.height);cx.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,S,S);
      for(let q=.8;q>.2;q-=.15){const d=cv.toDataURL('image/jpeg',q);if(d.length<45000)return res(d)}rej({msg:'That picture is too big.'})};
    im.onerror=()=>{URL.revokeObjectURL(url);rej({msg:'Couldn’t open that picture.'})};im.src=url})
}
function shrinkImage(file){
  return new Promise((res,rej)=>{
    if(!file.type.startsWith('image/'))return rej({msg:'That’s not a picture.'});
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{URL.revokeObjectURL(url);let max=1000,q=.75,out='';
      for(let i=0;i<8;i++){const s=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);
        const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);out=cv.toDataURL('image/jpeg',q);
        if(out.length<300000)return res(out);q-=.1;max=Math.round(max*.8)}
      rej({msg:'That picture is too big.'})};
    im.onerror=()=>{URL.revokeObjectURL(url);rej({msg:'Couldn’t open that picture.'})};im.src=url;
  });
}

function ringStart(incoming){ringStop();if(ME.mode==='dnd')return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){return}
  const beepOnce=()=>{if(!ST.sound)return;try{[0,0.25].forEach((d,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=incoming?(i?660:880):440;
    const t=AC.currentTime+d;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(incoming?.12:.05,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.25)})}catch(e){}};
  beepOnce();ringNode=setInterval(beepOnce,incoming?1500:3000)}

function callStatus(){
  const el=$('cstat');if(!el)return;const c=ST.calls[CALL.cid]||{},o=CALL.cid&&otherOf(CALL.cid);
  if(CALL.status==='live'){const sec=Math.floor((Date.now()-CALL.startAt)/1000);el.textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`+(c.screen===o?' · 🖥️ sharing screen':'')}
  else el.textContent=CALL.status==='connecting'?'Connecting…':CALL.role==='caller'?'Calling…':'…';
}
function makePC(){
  const pc=new RTCPeerConnection(ICE);
  CALL.remote=new MediaStream();$('rvid').srcObject=CALL.remote;
  pc.ontrack=e=>{if(!CALL.remote.getTracks().includes(e.track))CALL.remote.addTrack(e.track);$('rvid').play().catch(()=>{})};
  pc.onicecandidate=e=>{if(e.candidate)F.addDoc(F.collection(db,'calls',CALL.cid,'cands'),{session:CALL.session,side:CALL.role,c:JSON.stringify(e.candidate.toJSON())}).catch(()=>{})};
  pc.onconnectionstatechange=()=>{
    const s=pc.connectionState;
    if(s==='connected'&&CALL.status!=='live'){CALL.status='live';CALL.startAt=Date.now();clearInterval(CALL.clock);CALL.clock=setInterval(callStatus,1000);callUI()}
    if(s==='failed'){toast('😕 The call couldn’t connect. Some Wi-Fi (like school Wi-Fi) blocks calls.');hangUp('ended')}
    if(s==='disconnected'){clearTimeout(CALL.dcT);CALL.dcT=setTimeout(()=>{if(CALL.pc===pc&&pc.connectionState==='disconnected'){toast('📴 Call dropped');hangUp('ended')}},8000)}
  };
  CALL.local.getTracks().forEach(t=>pc.addTrack(t,CALL.local));
  if(CALL.type!=='video'&&CALL.role==='caller')pc.addTransceiver('video',{direction:'sendrecv'});
  $('lvid').srcObject=CALL.type==='video'?CALL.local:null;
  return pc;
}
function listenCands(){
  const other=CALL.role==='caller'?'callee':'caller';
  CALL.candUnsub=F.onSnapshot(F.query(F.collection(db,'calls',CALL.cid,'cands'),F.where('session','==',CALL.session)),s=>{
    s.forEach(d=>{const v=d.data();if(v.side!==other||CALL.seenCands.has(d.id))return;CALL.seenCands.add(d.id);
      let c;try{c=new RTCIceCandidate(JSON.parse(v.c))}catch(e){return}
      if(CALL.pc&&CALL.pc.remoteDescription)CALL.pc.addIceCandidate(c).catch(()=>{});else CALL.pendingCands.push(c)})
  },()=>{});
}
function flushCands(){const p=CALL.pendingCands;CALL.pendingCands=[];p.forEach(c=>CALL.pc.addIceCandidate(c).catch(()=>{}))}
async function startCall(type){
  if(ST.conv&&isGroup(ST.conv))return startGroupCall(cid(ST.conv),type);
  if(CALL.pc||GC.gid)return toast('You’re already in a call.');
  const pid=cid(ST.conv),o=otherOf(pid);if(!canChat(ST.conv))return;
  const cur=ST.calls[pid];
  if(cur&&cur.status==='ringing'&&cur.from===o&&Date.now()-cur.t<45000)return toast(who(o).nick+' is already calling you!');
  const local=await getMedia(type);if(!local)return;
  Object.assign(CALL,{cid:pid,session:rid(),role:'caller',type,local,status:'ringing',muted:false,camOff:false,screen:null,seenCands:new Set(),pendingCands:[]});
  CALL.handled.add(CALL.session);
  callUI();CALL.pc=makePC();listenCands();ringStart(false);
  try{
    const offer=await CALL.pc.createOffer();await CALL.pc.setLocalDescription(offer);
    await F.setDoc(F.doc(db,'calls',pid),{users:pid.split('_'),from:ME.uid,to:o,type,status:'ringing',session:CALL.session,offer:{type:offer.type,sdp:offer.sdp},answer:null,screen:null,t:Date.now()});
  }catch(e){toast(niceErr(e));return hangUp(null)}
  CALL.ringT=setTimeout(()=>{if(CALL.session&&CALL.status==='ringing'){toast(who(o).nick+' didn’t answer.');hangUp('missed')}},35000);
}
async function acceptCall(pid,data){
  closeModal();ringStop();
  if(GC.gid)leaveGroupCall();
  const local=await getMedia(data.type);
  if(!local){F.updateDoc(F.doc(db,'calls',pid),{status:'declined'}).catch(()=>{});return}
  Object.assign(CALL,{cid:pid,session:data.session,role:'callee',type:data.type,local,status:'connecting',muted:false,camOff:false,screen:null,seenCands:new Set(),pendingCands:[]});
  if(ST.conv!=='d:'+pid)openConv('d:'+pid);
  callUI();CALL.pc=makePC();listenCands();
  try{
    await CALL.pc.setRemoteDescription(data.offer);ensureVideoSendable(CALL.pc);flushCands();
    const ans=await CALL.pc.createAnswer();await CALL.pc.setLocalDescription(ans);
    await F.updateDoc(F.doc(db,'calls',pid),{answer:{type:ans.type,sdp:ans.sdp},status:'accepted'});
  }catch(e){toast('Couldn’t join the call.');hangUp('ended')}
}
async function share1(){
  const tr=await pickScreen();if(!tr||!CALL.pc)return;
  const t=videoTx(CALL.pc);if(!t){tr.stop();return toast('Couldn’t share your screen in this call.')}
  await t.sender.replaceTrack(tr);CALL.screen=tr;$('lvid').srcObject=new MediaStream([tr]);
  tr.onended=()=>stopShare1();
  F.updateDoc(F.doc(db,'calls',CALL.cid),{screen:ME.uid}).catch(()=>{});callUI();
}
async function stopShare1(){
  if(!CALL.screen)return;const tr=CALL.screen;CALL.screen=null;tr.stop();
  if(CALL.pc){const t=videoTx(CALL.pc);const cam=CALL.local&&CALL.local.getVideoTracks()[0]||null;if(t)await t.sender.replaceTrack(cam).catch(()=>{})}
  $('lvid').srcObject=CALL.type==='video'?CALL.local:null;
  if(CALL.cid)F.updateDoc(F.doc(db,'calls',CALL.cid),{screen:null}).catch(()=>{});callUI();
}
function hangUp(status){
  ringStop();clearTimeout(CALL.ringT);clearTimeout(CALL.dcT);clearInterval(CALL.clock);
  if(CALL.screen){CALL.screen.stop();CALL.screen=null}
  if(CALL.candUnsub)CALL.candUnsub();
  if(CALL.pc){try{CALL.pc.close()}catch(e){}}
  if(CALL.local)CALL.local.getTracks().forEach(t=>t.stop());
  if(status&&CALL.cid){const cur=ST.calls[CALL.cid];if(!cur||cur.session===CALL.session)F.updateDoc(F.doc(db,'calls',CALL.cid),{status,screen:null}).catch(()=>{})}
  const wasLive=CALL.status==='live';
  Object.assign(CALL,{pc:null,cid:null,session:null,role:null,type:null,local:null,remote:null,status:null,candUnsub:null});
  const ov=$('callov');if(ov){ov.className='';$('rvid').srcObject=null;$('lvid').srcObject=null}
  if(wasLive)toast('📴 Call ended');
}
function onCallsSnap(s){
  ST.calls={};s.forEach(d=>ST.calls[d.id]=d.data());
  for(const [pid,c] of Object.entries(ST.calls)){
    if(CALL.cid===pid&&CALL.session===c.session){
      if(CALL.role==='caller'&&c.answer&&CALL.pc&&!CALL.pc.currentRemoteDescription){clearTimeout(CALL.ringT);ringStop();CALL.status='connecting';callStatus();
        CALL.pc.setRemoteDescription(c.answer).then(flushCands).catch(()=>{})}
      if(c.status==='declined'&&CALL.role==='caller'){toast(who(c.to).nick+' declined the call.');hangUp(null)}
      else if(c.status==='busy'&&CALL.role==='caller'){toast(who(c.to).nick+' is busy right now.');hangUp(null)}
      else if(['ended','missed'].includes(c.status)&&CALL.status){hangUp(null)}
      else callUI();
      continue;
    }
    if(c.to===ME.uid&&c.status==='ringing'&&Date.now()-c.t<40000&&!CALL.handled.has(c.session)){
      CALL.handled.add(c.session);
      if(CALL.pc||GC.gid||ST.blocks.has(c.from)){F.updateDoc(F.doc(db,'calls',pid),{status:'busy'}).catch(()=>{});continue}
      showIncoming(pid,c);
    }
    if($('incoming')&&$('incoming').dataset.session===c.session&&c.status!=='ringing'){closeModal();ringStop();if(c.status==='missed'||c.status==='ended')toast('📵 Missed call from '+who(c.from).nick)}
  }
}
function showIncoming(pid,c){
  const w=who(c.from);
  modal(`<div id="incoming" class="incoming"><div class="cav ring" style="background:${w.color}33">${w.emoji}</div><h1></h1><p>${c.type==='video'?'🎥 Video call':'📞 Voice call'}…</p>
    <div class="inbtns"><button class="decline" id="idec">✖</button><button class="accept" id="iacc">${c.type==='video'?'🎥':'📞'}</button></div>
    <div class="inlbl"><span>Decline</span><span>Accept</span></div></div>`);
  $('incoming').dataset.session=c.session;$('mcard').querySelector('h1').textContent=w.nick;
  ringStart(true);
  if(document.hidden&&PREF.notif&&ME.mode!=='dnd'&&'Notification' in window&&Notification.permission==='granted'){try{const n=new Notification('📞 '+w.nick+' is calling',{body:'Open Ranton to answer',tag:'call'});n.onclick=()=>{window.focus();n.close()}}catch(e){}}
  $('iacc').onclick=()=>acceptCall(pid,c);
  $('idec').onclick=()=>{closeModal();ringStop();F.updateDoc(F.doc(db,'calls',pid),{status:'declined'}).catch(()=>{})};
  setTimeout(()=>{if($('incoming')&&$('incoming').dataset.session===c.session){closeModal();ringStop();toast('📵 Missed call from '+w.nick)}},Math.max(1000,40000-(Date.now()-c.t)));
}

/* ---------- group calls (up to 4 people) ---------- */
const GC={gid:null,session:null,type:null,local:null,screen:null,peers:{},unsubLinks:null,muted:false,camOff:false,startAt:0,clock:null,handled:new Set()};
const gref=gid=>F.doc(db,'groups',gid);
function liveParts(c){return Object.keys((c&&c.parts)||{}).filter(u=>u===ME.uid||isOnline(u)||GC.peers[u])}
async function startGroupCall(gid,type){
  if(CALL.pc)return toast('You’re already in a call.');
  if(GC.gid===gid)return;if(GC.gid)leaveGroupCall();
  const g=ST.groups[gid];if(!g)return;
  if(g.call&&g.call.session&&liveParts(g.call).length)return joinGroupCall(gid);
  const local=await getMedia(type);if(!local)return;
  const session=rid();
  try{await F.updateDoc(gref(gid),{call:{session,type,by:ME.uid,t:Date.now(),parts:{[ME.uid]:Date.now()},share:null}})}
  catch(e){local.getTracks().forEach(t=>t.stop());return toast(niceErr(e))}
  GC.handled.add(session);setupGC(gid,session,type,local,[]);
}
async function joinGroupCall(gid){
  if(CALL.pc)return toast('You’re already in a call.');
  if(GC.gid===gid)return;if(GC.gid)leaveGroupCall();
  closeModal();ringStop();
  const g=ST.groups[gid];const c=g&&g.call;
  if(!c||!c.session||!liveParts(c).length)return toast('That call already ended.');
  const others=liveParts(c).filter(x=>x!==ME.uid);
  if(others.length>=MAX_GCALL)return toast(`This call is full (${MAX_GCALL} people max).`);
  const local=await getMedia(c.type);if(!local)return;
  GC.handled.add(c.session);
  try{await F.updateDoc(gref(gid),{['call.parts.'+ME.uid]:Date.now()})}catch(e){local.getTracks().forEach(t=>t.stop());return toast(niceErr(e))}
  setupGC(gid,c.session,c.type,local,others);
}
function setupGC(gid,session,type,local,callTo){
  Object.assign(GC,{gid,session,type,local,screen:null,peers:{},muted:false,camOff:false,startAt:Date.now()});
  clearInterval(GC.clock);GC.clock=setInterval(()=>rGC(),1000);
  if(ST.conv!=='g:'+gid)openConv('g:'+gid);
  GC.unsubLinks=F.onSnapshot(F.query(F.collection(db,'groups',gid,'links'),F.where('session','==',session)),s=>{
    s.forEach(d=>{const v=d.data();
      if(v.to===ME.uid&&v.offer&&!GC.peers[v.from])answerPeer(d.id,v);
      if(v.from===ME.uid&&v.answer){const p=GC.peers[v.to];if(p&&p.pc&&!p.pc.currentRemoteDescription)p.pc.setRemoteDescription(v.answer).then(()=>flushPeer(p)).catch(()=>{})}
    })},()=>{});
  callTo.forEach(uid=>offerPeer(uid));
  rGC();
}
function newPeer(uid,lid,side){
  const pc=new RTCPeerConnection(ICE),p={uid,lid,side,pc,stream:new MediaStream(),seen:new Set(),pending:[],unsub:null,state:'connecting'};
  pc.ontrack=e=>{if(!p.stream.getTracks().includes(e.track))p.stream.addTrack(e.track);rGC()};
  pc.onicecandidate=e=>{if(e.candidate)F.addDoc(F.collection(db,'groups',GC.gid,'links',lid,'cands'),{side,c:JSON.stringify(e.candidate.toJSON())}).catch(()=>{})};
  pc.onconnectionstatechange=()=>{p.state=pc.connectionState;if(p.state==='failed')closePeer(uid);rGC()};
  GC.local.getAudioTracks().forEach(t=>pc.addTrack(t,GC.local));
  const vt=GC.screen||GC.local.getVideoTracks()[0];
  if(vt)pc.addTrack(vt,GC.local);else if(side==='from')pc.addTransceiver('video',{direction:'sendrecv'});
  p.unsub=F.onSnapshot(F.collection(db,'groups',GC.gid,'links',lid,'cands'),s=>{
    s.forEach(d=>{const v=d.data();if(v.side===side||p.seen.has(d.id))return;p.seen.add(d.id);
      let c;try{c=new RTCIceCandidate(JSON.parse(v.c))}catch(e){return}
      if(pc.remoteDescription)pc.addIceCandidate(c).catch(()=>{});else p.pending.push(c)})},()=>{});
  GC.peers[uid]=p;return p;
}
function flushPeer(p){const l=p.pending;p.pending=[];l.forEach(c=>p.pc.addIceCandidate(c).catch(()=>{}))}
async function offerPeer(uid){
  const lid=GC.session+'-'+ME.uid+'-'+uid,p=newPeer(uid,lid,'from');
  setTimeout(()=>{if(GC.peers[uid]===p&&p.pc.connectionState!=='connected')closePeer(uid)},25000);
  try{const o=await p.pc.createOffer();await p.pc.setLocalDescription(o);
    await F.setDoc(F.doc(db,'groups',GC.gid,'links',lid),{session:GC.session,from:ME.uid,to:uid,offer:{type:o.type,sdp:o.sdp},answer:null})}
  catch(e){closePeer(uid)}
}
async function answerPeer(lid,v){
  const p=newPeer(v.from,lid,'to');
  try{await p.pc.setRemoteDescription(v.offer);ensureVideoSendable(p.pc);flushPeer(p);
    if(GC.screen){const t=videoTx(p.pc);if(t&&!t.sender.track)await t.sender.replaceTrack(GC.screen)}
    const a=await p.pc.createAnswer();await p.pc.setLocalDescription(a);
    await F.updateDoc(F.doc(db,'groups',GC.gid,'links',lid),{answer:{type:a.type,sdp:a.sdp}})}
  catch(e){closePeer(v.from)}
}
function closePeer(uid){const p=GC.peers[uid];if(!p)return;try{p.unsub&&p.unsub()}catch(e){}try{p.pc.close()}catch(e){}delete GC.peers[uid];rGC()}
function onGroupCallState(gid,g,prev){
  const c=g.call;
  if(GC.gid===gid){
    if(!c||c.session!==GC.session){leaveGroupCall(true);return}
    Object.keys(GC.peers).forEach(uid=>{if(!(c.parts||{})[uid])closePeer(uid)});
    if(!(c.parts||{})[ME.uid]){leaveGroupCall(true);return}
    return;
  }
  if(c&&c.session&&!GC.handled.has(c.session)&&liveParts(c).length&&!(c.parts||{})[ME.uid]&&c.by!==ME.uid&&Date.now()-c.t<60000&&!ST.firstGroups){
    GC.handled.add(c.session);
    if(CALL.pc||GC.gid)return;
    const w=who(c.by);
    modal(`<div id="gincoming" class="incoming">${gavHTML(g,120).replace('class="av gav"','class="cav ring gav"')}<h1></h1><p></p>
      <div class="inbtns"><button class="decline" id="gdec">✖</button><button class="accept" id="gacc">${c.type==='video'?'🎥':'📞'}</button></div>
      <div class="inlbl"><span>Ignore</span><span>Join</span></div></div>`);
    $('mcard').querySelector('h1').textContent=String(g.name||'Group');$('mcard').querySelector('#gincoming p').textContent=w.nick+' started a '+(c.type==='video'?'video':'voice')+' call';
    ringStart(true);
    $('gacc').onclick=()=>joinGroupCall(gid);
    $('gdec').onclick=()=>{closeModal();ringStop()};
    setTimeout(()=>{if($('gincoming')){closeModal();ringStop()}},30000);
  }
  if($('gincoming')&&(!c||!liveParts(c).length)){closeModal();ringStop()}
}
async function shareG(){
  const tr=await pickScreen();if(!tr||!GC.gid)return;
  GC.screen=tr;tr.onended=()=>stopShareG();
  for(const p of Object.values(GC.peers)){const t=videoTx(p.pc);if(t)await t.sender.replaceTrack(tr).catch(()=>{})}
  F.updateDoc(gref(GC.gid),{'call.share':ME.uid}).catch(()=>{});rGC();
}
async function stopShareG(){
  if(!GC.screen)return;const tr=GC.screen;GC.screen=null;tr.stop();
  const cam=GC.local&&GC.local.getVideoTracks()[0]||null;
  for(const p of Object.values(GC.peers)){const t=videoTx(p.pc);if(t)await t.sender.replaceTrack(cam).catch(()=>{})}
  if(GC.gid)F.updateDoc(gref(GC.gid),{'call.share':null}).catch(()=>{});rGC();
}
function leaveGroupCall(remoteEnded){
  if(!GC.gid)return;const gid=GC.gid;
  if(GC.screen){GC.screen.stop();GC.screen=null}
  Object.keys(GC.peers).forEach(closePeer);
  if(GC.unsubLinks)GC.unsubLinks();clearInterval(GC.clock);
  if(GC.local)GC.local.getTracks().forEach(t=>t.stop());
  const g=ST.groups[gid],c=g&&g.call;
  if(!remoteEnded&&c&&c.session===GC.session){
    const rest=liveParts(c).filter(x=>x!==ME.uid);
    F.updateDoc(gref(gid),rest.length?{['call.parts.'+ME.uid]:F.deleteField(),...(c.share===ME.uid?{'call.share':null}:{})}:{call:null}).catch(()=>{});
  }
  Object.assign(GC,{gid:null,session:null,type:null,local:null,peers:{},unsubLinks:null});
  const ov=$('gcall');if(ov){ov.classList.remove('show');ov.querySelector('.ggrid').innerHTML=''}
  toast('📴 You left the call');rMsgs(true);rSide();
}
function rGC(){
  let ov=$('gcall');
  if(!GC.gid){if(ov)ov.classList.remove('show');return}
  if(!ov){ov=document.createElement('div');ov.id='gcall';ov.innerHTML=`<div class="gtop"><b id="gctitle"></b><span id="gctime"></span></div><div class="ggrid"></div>
    <div id="gbtns" class="cbtns2"><button id="gmute" title="Mute">🎙️</button><button id="gcam" title="Camera">📷</button><button id="gshare" title="Share screen">🖥️</button><button id="gend" class="end" title="Leave call">📞</button></div>`;
    document.body.appendChild(ov);
    $('gmute').onclick=()=>{GC.muted=!GC.muted;GC.local&&GC.local.getAudioTracks().forEach(t=>t.enabled=!GC.muted);rGC()};
    $('gcam').onclick=()=>{GC.camOff=!GC.camOff;GC.local&&GC.local.getVideoTracks().forEach(t=>t.enabled=!GC.camOff);rGC()};
    $('gshare').onclick=()=>GC.screen?stopShareG():shareG();
    $('gend').onclick=()=>leaveGroupCall();
  }
  ov.classList.add('show');
  const g=ST.groups[GC.gid]||{},c=g.call||{};
  $('gctitle').textContent=(GEMOJI.includes(g.emoji)?g.emoji:'💬')+' '+String(g.name||'Group');
  const sec=Math.floor((Date.now()-GC.startAt)/1000);$('gctime').textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
  $('gcam').style.display=GC.type==='video'?'':'none';
  $('gmute').textContent=GC.muted?'🔇':'🎙️';$('gmute').classList.toggle('off',GC.muted);$('gcam').classList.toggle('off',GC.camOff);$('gshare').classList.toggle('off',!!GC.screen);
  const grid=ov.querySelector('.ggrid');
  const ids=[ME.uid,...Object.keys(GC.peers)];
  grid.className='ggrid n'+ids.length;
  [...grid.children].forEach(t=>{if(!ids.includes(t.dataset.uid))t.remove()});
  ids.forEach(uid=>{
    let t=grid.querySelector(`[data-uid="${CSS.escape(uid)}"]`);
    if(!t){t=document.createElement('div');t.className='tile';t.dataset.uid=uid;t.innerHTML=`<video autoplay playsinline ${uid===ME.uid?'muted':''}></video><div class="tav"></div><div class="tname"></div>`;grid.appendChild(t)}
    const w=who(uid),v=t.querySelector('video'),me=uid===ME.uid,p=GC.peers[uid];
    const src=me?(GC.screen?new MediaStream([GC.screen]):GC.local):p&&p.stream;
    if(me){if(v._src!==(GC.screen||GC.local)){v.srcObject=src;v._src=GC.screen||GC.local}}
    else if(v.srcObject!==src)v.srcObject=src||null;
    v.play&&v.play().catch(()=>{});
    const showVid=me?((GC.type==='video'&&!GC.camOff)||!!GC.screen):(GC.type==='video'||c.share===uid);
    t.classList.toggle('vid',showVid);t.classList.toggle('mine',me&&!GC.screen);
    const av=t.querySelector('.tav');av.textContent=w.emoji;av.style.background=w.color+'33';
    t.querySelector('.tname').textContent=(me?'You':w.nick)+(c.share===uid?' · 🖥️':'')+(!me&&p&&p.state!=='connected'?' · connecting…':'');
  });
}

function chName(k,ch){if(ch==='general')return'general';const g=convData(k)||{};const c=(g.channels||[]).find(x=>x.id===ch);return c?String(c.name).slice(0,20):ch}
function mentionsMe(t){if(!t)return false;t=String(t).toLowerCase();const me=who(ME.uid);return t.includes('@'+String(ME.uname).toLowerCase())||t.includes('@'+String(ME.nick).toLowerCase())||t.includes('@everyone')}
function isFun(t){return /(^|\s)(gg|ggs|happy birthday|congrats|congratulations|lets go|let's go|🎉|🥳)(\s|!|$)/i.test(String(t||''))}
function ytId(u){const m=String(u||'').match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);return m?m[1]:null}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function lastSummary(p){if(p.text)return p.text.slice(0,60);if(p.img)return'📷 Picture';if(p.audio)return'🎤 Voice message';if(p.file)return'📄 '+String(p.file.name).slice(0,40);if(p.sticker)return'🏷️ Sticker';if(p.poll)return'📊 '+String(p.poll.q).slice(0,50);if(p.game)return'🎮 '+GAMES[p.game.kind].name;return''}

/* ---------- confetti ---------- */
function confetti(){
  if(document.querySelector('canvas.confetti'))return;
  const cv=el('canvas','confetti');cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);const cx=cv.getContext('2d');
  const cols=['#a78bfa','#ff7a90','#7bd88f','#ffcf5c','#6cb6ff','#f472b6'];
  const P=Array.from({length:160},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,s:5+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(t){cx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);cx.restore()});
    if(t-t0<2600)requestAnimationFrame(f);else cv.remove()})(t0);
}

/* ---------- text rendering (links + mentions) ---------- */
function renderText(box,text){
  const parts=String(text).slice(0,400).split(/(https?:\/\/[^\s<]+|@[A-Za-z0-9_]{2,16})/g);
  parts.forEach(p=>{
    if(/^https?:\/\//.test(p)){const a=el('a','lnk',p);a.href=p;a.target='_blank';a.rel='noopener noreferrer nofollow';box.appendChild(a)}
    else if(/^@[A-Za-z0-9_]{2,16}$/.test(p)){const s=el('span','mention'+(mentionsMe(p)?' me':''),p);box.appendChild(s)}
    else formatInto(box,p);
  });
}

const WT={vid:null,player:null,applying:0,ready:false,apiP:null,lastKey:''};
function ytApi(){if(WT.apiP)return WT.apiP;WT.apiP=new Promise(res=>{if(window.YT&&YT.Player)return res();window.onYouTubeIframeAPIReady=res;const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s)});return WT.apiP}
async function startWatch(k,vid){
  if(!vid){modal(`<h1>📺 Watch together</h1><p>Paste a YouTube link. Everyone in this chat will see the same video, and play/pause stays in sync.</p><input type="text" id="wurl" placeholder="https://youtube.com/watch?v=…"><div class="err" id="werr"></div><button class="big" id="wgo">Start</button><button class="big ghost" onclick="closeModal()">Cancel</button>`);
    $('wgo').onclick=()=>{const v=ytId($('wurl').value);if(!v)return $('werr').textContent='That doesn’t look like a YouTube link.';closeModal();startWatch(k,v)};return}
  try{await convSet(k,{watch:{vid,by:ME.uid,playing:false,t:0,at:Date.now()}});await sendMsg(k,{text:'📺 Started watching together: https://youtu.be/'+vid})}catch(e){toast(niceErr(e))}
}
function rWatch(){
  const box=$('watchbox');const c=ST.conv&&convData(ST.conv),w=c&&c.watch;
  if(!w||!w.vid){if(WT.vid){try{WT.player&&WT.player.destroy()}catch(e){}WT.player=null;WT.vid=null;WT.ready=false}box.innerHTML='';box.style.display='none';return}
  box.style.display='';
  if(WT.vid!==w.vid||!box.querySelector('#ytp')){
    try{WT.player&&WT.player.destroy()}catch(e){}WT.player=null;WT.ready=false;WT.vid=w.vid;
    box.innerHTML='<div class="wtop"><span>📺 Watching together</span><button class="fbtn no" id="wclose">Stop</button></div><div class="wframe"><div id="ytp"></div></div>';
    $('wclose').onclick=()=>convSet(ST.conv,{watch:F.deleteField()}).catch(e=>toast(niceErr(e)));
    ytApi().then(()=>{if(WT.vid!==w.vid)return;WT.player=new YT.Player('ytp',{videoId:w.vid,playerVars:{playsinline:1,rel:0},events:{
      onReady:()=>{WT.ready=true;applyWatch()},
      onStateChange:e=>{if(Date.now()<WT.applying||!ST.conv)return;const st=e.data;if(st!==1&&st!==2)return;
        const t=WT.player.getCurrentTime();convSet(ST.conv,{watch:{vid:WT.vid,by:ME.uid,playing:st===1,t,at:Date.now()}}).catch(()=>{})}}})});
  }else applyWatch();
}
function applyWatch(){
  const c=ST.conv&&convData(ST.conv),w=c&&c.watch;if(!w||!WT.player||!WT.ready)return;
  const key=[w.playing,w.t,w.at,w.by].join('|');if(key===WT.lastKey)return;WT.lastKey=key;
  if(w.by===ME.uid&&Date.now()-w.at<3000)return;
  const target=w.t+(w.playing?(Date.now()-w.at)/1000:0);WT.applying=Date.now()+1200;
  try{if(Math.abs(WT.player.getCurrentTime()-target)>1.5)WT.player.seekTo(target,true);w.playing?WT.player.playVideo():WT.player.pauseVideo()}catch(e){}
}

/* ---------- mini-games ---------- */
const GAMES={
  ttt:{name:'Tic-tac-toe',icon:'❌⭕',init:()=>({b:'.........'})},
  c4:{name:'Connect four',icon:'🔴🟡',init:()=>({b:'.'.repeat(42)})},
  rps:{name:'Rock paper scissors',icon:'✊✋✌️',init:()=>({picks:{}})}
};
function tttWin(b){const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];for(const[a,c,d]of L)if(b[a]!=='.'&&b[a]===b[c]&&b[a]===b[d])return b[a];return b.includes('.')?null:'draw'}
function c4Win(b){const g=(r,c)=>r>=0&&r<6&&c>=0&&c<7?b[r*7+c]:null;
  for(let r=0;r<6;r++)for(let c=0;c<7;c++){const v=g(r,c);if(v==='.')continue;for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]])if([1,2,3].every(i=>g(r+dr*i,c+dc*i)===v))return v}
  return b.includes('.')?null:'draw'}
function rpsWin(a,b){if(a===b)return'draw';return(a==='r'&&b==='s')||(a==='p'&&b==='r')||(a==='s'&&b==='p')?0:1}
function gameModal(k){
  const others=convUsers(k).filter(x=>x!==ME.uid&&!ST.blocks.has(x));

const REC={mr:null,chunks:[],t0:0,timer:null,stream:null};
async function startRec(k){
  if(!window.MediaRecorder)return toast('Voice messages don’t work in this browser.');
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){return toast('🎙️ Allow the microphone to send voice messages.')}
  const type=['audio/webm;codecs=opus','audio/ogg;codecs=opus','audio/mp4','audio/webm'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
  const mr=new MediaRecorder(stream,type?{mimeType:type,audioBitsPerSecond:24000}:{audioBitsPerSecond:24000});
  Object.assign(REC,{mr,chunks:[],t0:Date.now(),stream});mr.ondataavailable=e=>e.data.size&&REC.chunks.push(e.data);mr.start(250);
  REC.timer=setInterval(()=>{const s=Math.floor((Date.now()-REC.t0)/1000);const t=$('rectime');if(t)t.textContent=`0:${String(s).padStart(2,'0')} / 0:30`;if(s>=30)stopRec(k,true)},250);

}
function stopRec(k,send){
  if(!REC.mr)return;clearInterval(REC.timer);const mr=REC.mr;REC.mr=null;
  mr.onstop=()=>{REC.stream.getTracks().forEach(t=>t.stop());rComposer();if(!send)return;
    const blob=new Blob(REC.chunks,{type:mr.mimeType||'audio/webm'});if(blob.size<800)return toast('That was too short.');
    const fr=new FileReader();fr.onload=()=>{const d=fr.result;if(d.length>380000)return toast('That voice message is too long.');sendMsg(k,{audio:d}).catch(e=>toast(niceErr(e)))};fr.readAsDataURL(blob)};
  mr.stop();
}

const ADMIN_NAME='hzgnaf';
const isAdmin=()=>ME.uname===ADMIN_NAME;
const todayKey=(d=new Date())=>d.toISOString().slice(0,10);
const yesterdayKey=()=>todayKey(new Date(Date.now()-864e5));
const NAMECOLORS=['#ff8a5b','#7bd88f','#6cb6ff','#e6c84f','#d68cff','#ff7a90','#5ee6d0','#f5a3ff','#ffffff','#facc15'];

/* ---------- XP + levels ---------- */
function levelOf(msgs){const xp=(msgs||0)*10;const lv=Math.floor(Math.sqrt(xp/50))+1;const cur=50*(lv-1)**2,next=50*lv**2;return{lv,xp,cur,next,pct:Math.min(100,Math.round((xp-cur)/(next-cur)*100))}}

/* ---------- birthdays ---------- */
const isBday=id=>{const p=ST.profiles[id]||{};return typeof p.bday==='string'&&p.bday===todayKey().slice(5)};
function bdayCheck(){
  const k='ranton-bday-'+todayKey();let seen=false;try{seen=localStorage.getItem(k)}catch(e){}
  if(seen)return;const list=Object.keys(ST.friends).filter(isBday);
  if(isBday(ME.uid)){toast('🎂 Happy birthday, '+ME.nick+'!');confetti()}
  else if(list.length){toast('🎂 Today is '+list.map(x=>who(x).nick).join(' & ')+'’s birthday!')}
  else return;try{localStorage.setItem(k,'1')}catch(e){}
}

/* ---------- streaks (DMs) ---------- */
function streakOf(k){
  if(!k||isGroup(k))return 0;const s=(convData(k)||{}).streak;if(!s||!s.n)return 0;
  return (s.day===todayKey()||s.day===yesterdayKey())?s.n:0;
}
function streakUpdate(k){
  const c=convData(k)||{},s=c.streak||{},t=todayKey(),a={...(s.a||{}),[ME.uid]:t};
  const users=cid(k).split('_');let n=s.n||0,day=s.day||'';
  if(users.every(u=>a[u]===t)&&day!==t){n=day===yesterdayKey()?n+1:1;day=t;if(n>=2)setTimeout(()=>toast('🔥 '+n+' day streak with '+convTitle(k)+'!'),500)}
  return{a,n,day};
}

const EMOJI_ONLY=/^(?:\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic}|\p{Emoji_Modifier})*\s*){1,3}$/u;
function formatInto(box,str){
  // **bold**  *italic*  `code`  ||spoiler||
  const re=/(\*\*[^*]+\*\*|\|\|[^|]+\|\||`[^`]+`|\*[^*\s][^*]*\*)/g;
  str.split(re).forEach(p=>{
    if(!p)return;
    if(/^\*\*[^*]+\*\*$/.test(p))box.appendChild(el('b',null,p.slice(2,-2)));
    else if(/^\|\|[^|]+\|\|$/.test(p)){const s=el('span','spoiler',p.slice(2,-2));s.title='Click to reveal';s.onclick=e=>{e.stopPropagation();s.classList.add('shown')};box.appendChild(s)}
    else if(/^`[^`]+`$/.test(p))box.appendChild(el('code','icode',p.slice(1,-1)));
    else if(/^\*[^*\s][^*]*\*$/.test(p))box.appendChild(el('i',null,p.slice(1,-1)));
    else box.appendChild(document.createTextNode(p));
  });
}

/* ---------- slash commands ---------- */
const EIGHT=['Yes!','No.','Definitely 😎','Ask again later…','No way 😂','Maybe 🤔','100% yes','I don’t think so','Signs point to yes','Very doubtful'];
function runCommand(text){
  const t=text.trim();
  let m=t.match(/^\/roll(?:\s+(\d{1,4}))?$/i);if(m){const n=Math.max(2,Math.min(1000,+(m[1]||6)));return`🎲 rolled a **${1+Math.floor(Math.random()*n)}** (1–${n})`}
  if(/^\/flip$/i.test(t))return`🪙 flipped a coin: **${Math.random()<.5?'Heads':'Tails'}**`;
  m=t.match(/^\/8ball\s*(.*)$/i);if(m)return`🎱 ${m[1]?'“'+m[1].slice(0,120)+'” → ':''}**${EIGHT[Math.floor(Math.random()*EIGHT.length)]}**`;
  if(/^\/(help|commands)$/i.test(t)){toast('Commands: /roll  /roll 20  /flip  /8ball question');return null}
  if(/^\/[a-z0-9]+$/i.test(t)){toast('Unknown command. Try /roll, /flip or /8ball');return null}
  return t;
}

  $('mcard').classList.add('wide');
  const cv=$('dcv'),cx=cv.getContext('2d');let col='#111111',erase=false,drawing=false,last=null;const hist=[];
  const bg=()=>{cx.fillStyle='#ffffff';cx.fillRect(0,0,cv.width,cv.height)};bg();
  ['#111111','#ef4444','#f97316','#facc15','#22c55e','#3b82f6','#a855f7','#ec4899','#8b5a2b','#ffffff'].forEach(c=>{const b=el('button','dcol'+(c===col?' on':''));b.style.background=c;b.onclick=()=>{col=c;erase=false;$('der').classList.remove('on');$('dcols').querySelectorAll('.dcol').forEach(x=>x.classList.toggle('on',x===b))};$('dcols').appendChild(b)});

  const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
  cv.onpointerdown=e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);hist.push(cx.getImageData(0,0,cv.width,cv.height));if(hist.length>30)hist.shift();drawing=true;last=pos(e);dot(last)};
  cv.onpointermove=e=>{if(!drawing)return;const p=pos(e);cx.strokeStyle=erase?'#ffffff':col;cx.lineWidth=+$('dsz').value*(erase?2:1);cx.lineCap=cx.lineJoin='round';cx.beginPath();cx.moveTo(last.x,last.y);cx.lineTo(p.x,p.y);cx.stroke();last=p};
  cv.onpointerup=cv.onpointercancel=()=>{drawing=false};
  function dot(p){cx.fillStyle=erase?'#ffffff':col;cx.beginPath();cx.arc(p.x,p.y,+$('dsz').value*(erase?1:.5),0,7);cx.fill()}
  $('dgo').onclick=async()=>{let q=.8,d='';for(;q>.2;q-=.15){d=cv.toDataURL('image/jpeg',q);if(d.length<300000)break}

function openStories(uid,startIdx){
  const list=liveStories(uid);if(!list.length)return;
  let i=startIdx!=null?startIdx:Math.max(0,list.findIndex(s=>!STO.seen.has(s.id)));if(i<0)i=0;

  let ov=$('storyov');if(ov)ov.remove();
  ov=el('div');ov.id='storyov';document.body.appendChild(ov);
  const me=uid===ME.uid,w=who(uid);let timer=null,paused=false,t0=0,elapsed=0;const DUR=6000;
  const close=()=>{clearInterval(timer);ov.remove();rStoryBar()};
  function show(){
    const s=list[i];if(!s)return close();
    STO.seen.add(s.id);saveSeen();
    if(!me)F.setDoc(F.doc(db,'stories',uid,'items',s.id,'views',ME.uid),{at:Date.now()}).catch(()=>{});

      <div class="sfoot"></div></div>`;
    ov.querySelector('.shead b').textContent=me?'Your story':w.nick;ov.querySelector('.shead small').textContent=agoText(s.at);
    const body=ov.querySelector('.sbody');
    if(s.img&&goodPic(s.img)){body.style.background='#000';const im=el('img');im.src=s.img;body.appendChild(im);if(s.text){const c=el('div','scap',s.text);body.appendChild(c)}}
    else{body.style.background=SBG[s.bg]||SBG[0];body.appendChild(el('div','stxt',s.text||''))}
    ov.querySelector('.sx').onclick=close;
    ov.querySelector('.prev').onclick=()=>{if(i>0){i--;start()}};
    ov.querySelector('.next').onclick=()=>{i++;i<list.length?start():close()};
    const foot=ov.querySelector('.sfoot');
    if(me){
      const vb=el('button','sviews','👀 Seen by …');foot.appendChild(vb);
      F.getDocs(F.collection(db,'stories',uid,'items',s.id,'views')).then(v=>{const ids=[];v.forEach(d=>ids.push(d.id));ids.forEach(watchProfile);vb.textContent='👀 Seen by '+ids.length;
        vb.onclick=()=>{paused=true;alertList('👀 Seen by',ids.length?ids.map(x=>who(x).nick):['Nobody yet'])}}).catch(()=>{vb.textContent='👀 Views'});
      ov.querySelector('.sdel').onclick=()=>{F.deleteDoc(F.doc(db,'stories',uid,'items',s.id)).then(()=>{toast('Story deleted');close()}).catch(e=>toast(niceErr(e)))};
    }else{
      foot.innerHTML='<input type="text" class="sreply" maxlength="200" placeholder="Reply…"><button class="sheart">❤️</button><button class="sfire">🔥</button><button class="slol">😂</button>';
      const inp=foot.querySelector('.sreply');inp.onfocus=()=>paused=true;inp.onblur=()=>paused=false;
      const send=async txt=>{const k=dmKey(uid);try{await sendMsg(k,{text:('📸 Replied to your story: '+txt).slice(0,400)});toast('Sent to '+w.nick+'!')}catch(e){toast(niceErr(e))}};
      inp.onkeydown=e=>{if(e.key==='Enter'&&inp.value.trim()){send(inp.value.trim());inp.value='';inp.blur()}};

    }

function shake(){const a=$('app');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake');ping(true);setTimeout(()=>ping(false),180);if(navigator.vibrate)try{navigator.vibrate([80,40,80])}catch(e){}}

/* ---------- question of the day ---------- */
const QOTD=['If you could have any superpower, what would it be?','What’s the best snack of all time?','Would you rather fly or be invisible?','What game are you obsessed with right now?','What’s the funniest thing that happened this week?','If you could live anywhere, where?','What’s your hot take that everyone disagrees with?','Pizza or burgers? Defend your answer.','What song is stuck in your head?','If you had $1,000,000, what’s the first thing you’d buy?','What’s the best movie ever made?','Cats or dogs?','What would your dream birthday party be?','If you were a YouTuber, what would your channel be about?','What’s one thing you’re really good at?','Would you rather be a pro athlete or a famous gamer?','What’s the weirdest food you’ve ever tried?','If animals could talk, which would be the rudest?','Beach or mountains?','What’s your favorite emoji and why?','Would you rather time travel to the past or the future?','What’s the best thing about today?','Which app could you never delete?','What’s your go-to comfort food?'];
function qotd(){const d=Math.floor(Date.now()/864e5);return QOTD[d%QOTD.length]}
function qotdCard(){
  const c=el('div','qotd');c.innerHTML='<small>🤔 QUESTION OF THE DAY</small><b></b><button class="send">Ask a friend</button>';
  c.querySelector('b').textContent=qotd();
  c.querySelector('button').onclick=()=>{const fids=Object.keys(ST.friends).filter(f=>!ST.blocks.has(f));
    if(!fids.length)return toast('Add a friend first!');
    modal(`<h1>🤔 Ask who?</h1><div class="pick" id="qpick"></div><button class="big ghost" onclick="closeModal()">Cancel</button>`);
    fids.forEach(f=>{const r=el('label','pickrow');r.innerHTML=`${avHTML(f,30)}<span></span>`;r.querySelector('span').textContent=who(f).nick;
      r.onclick=()=>{closeModal();const k=dmKey(f);DRAFTS[draftKey(k)]='🤔 '+qotd();openConv(k)};$('qpick').appendChild(r)})};
  return c;
}

/* ---------- hook into the app ---------- */
{const o=redraw;redraw=function(){o.apply(this,arguments);if(!ST.started)return;syncStoryWatchers();rStoryBar();applyWall()}}
{const o=openConv;openConv=function(){const r=o.apply(this,arguments);applyWall();return r}}
{const o=friendsPage;friendsPage=function(box){o(box);const w=box.querySelector('.fpage');if(w&&ST.tab!=='add')w.insertBefore(qotdCard(),w.children[1]||null)}}
{const o=plusMenu;plusMenu=function(anchor,k){o(anchor,k);const p=document.querySelector('.pmenu');if(!p)return;
  [['👋','Nudge',()=>sendNudge(k)],['🖼️','Chat wallpaper',()=>wallModal(k)]].forEach(([e,t,fn])=>{const b=el('button',null,e+'  '+t);b.onclick=ev=>{ev.stopPropagation();p.remove();fn()};p.appendChild(b)})}}
{const o=notify;notify=function(k,c){if(c&&c.last&&c.last.text==='👋 Nudge!'&&c.last.by!==ME.uid){shake();if(ST.conv!==k)toast('👋 '+who(c.last.by).nick+' nudged you!');return}return o.apply(this,arguments)}}
{const o=signOut;signOut=async function(){stopStories();const b=$('storybar');if(b)b.innerHTML='';return o.apply(this,arguments)}}

/* ---------- chrome ---------- */
function closeDrawers(){['rail','side','note'].forEach(i=>$(i).classList.remove('open'));$('scrim').classList.remove('show')}
$('obSide').onclick=()=>{$('rail').classList.add('open');$('side').classList.add('open');$('scrim').classList.add('show')};
$('obNote').onclick=()=>{if(window.innerWidth>900){$('app').classList.toggle('shownote');return}$('note').classList.add('open');$('scrim').classList.add('show')};
$('scrim').onclick=closeDrawers;
$('homeBtn').onclick=openHome;
$('navChats').onclick=()=>{if(window.innerWidth<=900){$('side').classList.add('open');$('scrim').classList.add('show')}else{const f=document.querySelector('#chlist .dmrow');if(f&&!ST.conv)f.click()}};
$('setBtn').onclick=()=>{if(ST.started)settingsModal()};
$('me').onclick=()=>{if(ST.started)settingsModal('profile')};
$('callA').onclick=()=>startCall('audio');
$('callV').onclick=()=>startCall('video');
$('mute').onclick=()=>{ST.sound=!ST.sound;$('mute').textContent=ST.sound?'🔔':'🔕'};
$('srchBtn').onclick=()=>{ST.searchOpen=!ST.searchOpen;if(!ST.searchOpen)ST.search='';rSearchBar();rMsgs()};
$('pinBtn').onclick=pinsModal;
boot();

</script>
